<title>כרטיס ליום הולדת</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Suez+One&display=swap">
<style>
/* Layout: page 1 is a dark, glittering stage with a 3D tilting card wrapped in chains and a lock; page 2 is a light, warm
   winter sorting game with floating cubes; page 3 is the reveal. Hebrew, right to left, so the card hinges on the right. */
:root {
  --pine: #0d3a31;
  --pine-deep: #06201b;
  --ruby: #a3283c;
  --ruby-deep: #570f21;
  --gold: #f0cd7a;
  --gold-deep: #b48a38;
  --cream: #fbf1e2;
  --snow: #fffaf1;
  --ink: #4b1620;
  --berry: #d63c4a;
  --leaf: #2f8a66;
  --ice: #8fb7d4;
  --steel: #d6dde1;
  --steel-deep: #8a959b;
  --display: 'Suez One', 'Frank Ruhl Libre', Georgia, serif;
  --body: 'Heebo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --W: min(68vw, 300px);
  --H: calc(var(--W) * 1.42);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--pine-deep);
  color: var(--cream);
  font-family: var(--body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
html.locked, html.locked body { overflow: hidden; height: 100%; touch-action: none; }
html.unlocked { scroll-snap-type: y proximity; }
.bleed { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ================= PAGE 1 : the card ================= */
.stage {
  position: relative; min-height: 100dvh; display: grid; place-items: center; overflow: hidden;
  scroll-snap-align: start;
  background:
    radial-gradient(ellipse 80% 60% at 50% 42%, #1f6a57 0%, rgba(31,106,87,0) 70%),
    radial-gradient(ellipse 60% 40% at 15% 100%, rgba(163,40,60,.45) 0%, rgba(163,40,60,0) 70%),
    radial-gradient(ellipse 60% 40% at 90% 0%, rgba(240,205,122,.22) 0%, rgba(240,205,122,0) 70%),
    linear-gradient(180deg, #0b2f28, var(--pine-deep));
}
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.flake { position: absolute; top: 0; border-radius: 50%; background: #fff; animation: snowfall linear infinite; will-change: transform; }
@keyframes snowfall { from { transform: translate3d(0,-8vh,0); } to { transform: translate3d(var(--sw),108vh,0); } }
.bokeh { position: absolute; border-radius: 50%; filter: blur(3px); animation: twinkle ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.9); } 50% { opacity: .75; transform: scale(1.1); } }

.cardwrap { position: relative; z-index: 2; perspective: 1600px; transition: transform 2.8s cubic-bezier(.45,.05,.2,1); will-change: transform; }
.tilt { transform-style: preserve-3d; will-change: transform; }
.card { position: relative; width: var(--W); height: var(--H); transform-style: preserve-3d; }
.ground {
  position: absolute; left: 8%; right: 8%; bottom: -46px; height: 34px; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 70%); filter: blur(5px);
  transition: transform 2.8s cubic-bezier(.45,.05,.2,1), opacity 2s;
}
.opened-spread .ground { transform: scaleX(2); }
.page-base, .cover, .face, .thick { position: absolute; inset: 0; }
.thick { background: #cdb98d; border-radius: 10px 3px 3px 10px; }
.t1 { transform: translateZ(-2px); } .t2 { transform: translateZ(-4px); background: #b49d6e; }
.page-base {
  background: linear-gradient(260deg, #eadcbf 0, var(--snow) 12%, var(--snow) 100%);
  border-radius: 10px 3px 3px 10px; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 8% 9%; gap: .4em;
}
.page-base .kick { font-size: 12px; color: var(--gold-deep); margin: 0; font-weight: 500; letter-spacing: .04em; }
.page-base h1 { font-family: var(--display); font-weight: 400; font-size: calc(var(--W) * .17); line-height: 1.12; margin: 0; color: var(--ruby); text-wrap: balance; }
.page-base .nm { font-family: var(--display); font-size: calc(var(--W) * .13); margin: 0; color: var(--leaf); }
.rule { width: 50px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold-deep), transparent); margin: .5em 0; }

.cover { transform-origin: right center; transform-style: preserve-3d; transform: translateZ(1px); transition: transform 2.8s cubic-bezier(.45,.05,.2,1); }
.cover.open { transform: translateZ(1px) rotateY(180deg); }
.face { backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px 3px 3px 10px; }
.front { transform-style: preserve-3d; overflow: visible; }
.front > * { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 10px 3px 3px 10px; }
.art-fg { transform: translateZ(7px); }
.sheen {
  position: absolute; inset: 0; border-radius: 10px 3px 3px 10px; pointer-events: none; transform: translateZ(9px);
  background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,244,200,.34) 46%, rgba(255,255,255,0) 62%) var(--sheen, 50%) 0 / 300% 100%;
  mix-blend-mode: screen;
}
.spine { position: absolute; top: 0; bottom: 0; right: 0; width: 14px; border-radius: 0 3px 3px 0; background: linear-gradient(270deg, rgba(0,0,0,.5), rgba(0,0,0,0)); transform: translateZ(1px); }
.back {
  transform: rotateY(180deg);
  background: linear-gradient(80deg, #eadcbf 0, var(--snow) 12%, var(--snow) 100%);
  border-radius: 3px 10px 10px 3px; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10%; gap: .7em;
}
.back .kick { font-size: 12px; color: var(--gold-deep); margin: 0; font-weight: 500; }
.back .line { font-family: var(--display); font-size: calc(var(--W) * .085); line-height: 1.4; margin: 0; color: var(--ruby-deep); text-wrap: balance; }
.back .todo { font-size: 13px; opacity: .55; margin: 0; }

/* chains + lock sit above the cover in 3D */
.chains { position: absolute; inset: 0; pointer-events: none; z-index: 3; transform: translateZ(12px); }
.link { position: absolute; border-radius: 99px; border: 4.5px solid var(--steel); box-shadow: inset 0 0 0 1px rgba(0,0,0,.28), 0 3px 4px rgba(0,0,0,.5); }
.link.lk-edge { border-color: var(--steel-deep); border-width: 3px; }
.link.fall { animation: fall 1.5s cubic-bezier(.55,0,.9,.55) forwards; animation-delay: var(--d); }
@keyframes fall {
  0% { transform: translate(0,0) rotate(0); }
  15% { transform: translate(calc(var(--dx) * .1), -10px) rotate(calc(var(--r) * .1)); }
  100% { transform: translate(var(--dx), 110vh) rotate(var(--r)); }
}
.lockwrap { position: absolute; left: 50%; top: 50%; width: 84px; height: 104px; margin: -52px 0 0 -42px; transform: translateZ(26px); z-index: 4; pointer-events: none; }
.lock { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 7px 8px rgba(0,0,0,.55)); transition: filter .25s; }
.lock.near { filter: drop-shadow(0 0 16px rgba(240,205,122,.95)) drop-shadow(0 7px 8px rgba(0,0,0,.5)); animation: tremble .18s linear infinite; }
.lock .shackle { transform-origin: 62px 46px; transition: transform .6s cubic-bezier(.3,1.5,.5,1); }
.lock.unlocked .shackle { transform: translateY(-13px) rotate(-30deg); }
.lock.drop { animation: lockdrop 1.1s cubic-bezier(.55,0,.9,.55) forwards; }
@keyframes lockdrop { to { transform: translateY(95vh) rotate(24deg); } }
@keyframes tremble { 0%,100% { translate: 0 0; } 25% { translate: -1.5px 1px; } 75% { translate: 1.5px -1px; } }

/* key */
.keyzone { position: absolute; z-index: 6; left: max(14px, env(safe-area-inset-left, 0px)); bottom: max(28px, calc(env(safe-area-inset-bottom, 0px) + 20px)); direction: ltr; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; pointer-events: none; }
.keyhint { direction: rtl; font-size: 13px; font-weight: 500; color: var(--gold); opacity: .95; transition: opacity .4s; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.keyhint.gone { opacity: 0; }
.key { width: 120px; height: 40px; cursor: grab; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; transform-origin: 97% 50%; filter: drop-shadow(0 3px 5px rgba(0,0,0,.55)); outline-offset: 6px; }
.key.idle { animation: nudge 2.4s ease-in-out infinite; }
.key.dragging { cursor: grabbing; transition: none; }
.key.back-home { transition: transform .45s cubic-bezier(.3,1.4,.5,1); }
.key.snap { transition: transform .18s ease-out; }
.key.turn { transition: transform .55s cubic-bezier(.5,0,.3,1); }
.key.vanish { opacity: 0; transition: opacity .5s; }
@keyframes nudge { 0%,60%,100% { transform: translateX(0); } 70% { transform: translateX(10px); } 80% { transform: translateX(0); } 90% { transform: translateX(7px); } }

.scrollcue { position: absolute; z-index: 5; bottom: 62px; left: 0; right: 0; margin: auto; width: max-content; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--cream); font-weight: 500; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity 1s; background: none; border: 0; font-family: var(--body); cursor: pointer; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.scrollcue.on { opacity: 1; pointer-events: auto; }
.scrollcue svg { width: 22px; height: 22px; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
.drift { position: absolute; z-index: 4; left: 0; right: 0; bottom: -1px; height: 54px; width: 100%; display: block; pointer-events: none; }

canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

/* ================= PAGE 2 : the sorting game ================= */
.game {
  position: relative; min-height: 100dvh; scroll-snap-align: start; color: var(--ink); text-align: center;
  padding-top: 40px; padding-bottom: 44px;
  background:
    radial-gradient(circle at 12% 8%, rgba(214,60,74,.12), rgba(214,60,74,0) 38%),
    radial-gradient(circle at 92% 22%, rgba(47,138,102,.12), rgba(47,138,102,0) 38%),
    radial-gradient(circle at 50% 100%, rgba(240,205,122,.35), rgba(240,205,122,0) 55%),
    linear-gradient(180deg, #fbf1e2 0%, #f8e7d4 60%, #f2d8c4 100%);
}
.game h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.45rem, 6.2vw, 2.1rem); line-height: 1.25; margin: 0 auto .35em; max-width: 24ch; color: var(--ruby-deep); text-wrap: balance; }
.game .sub { margin: 0 0 .5em; font-size: 15px; opacity: .75; }
.prog { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ruby); background: rgba(255,255,255,.7); padding: 5px 14px; border-radius: 99px; box-shadow: 0 2px 8px rgba(120,60,40,.12); }
.prog i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: rgba(163,40,60,.2); transition: background .3s, transform .3s; }
.prog i.on { background: var(--berry); transform: scale(1.2); }

.field { position: relative; height: clamp(270px, 42dvh, 380px); max-width: 560px; margin: 14px auto 10px; }
.cpos { position: absolute; touch-action: none; cursor: grab; z-index: 2; user-select: none; -webkit-user-select: none; }
.cpos::after { content: ""; position: absolute; left: 12%; right: -4%; bottom: -14px; height: 14px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(90,40,30,.38), rgba(90,40,30,0) 70%); transition: transform .2s, opacity .2s; }
.cpos.back { transition: left .5s cubic-bezier(.3,1.3,.5,1), top .5s cubic-bezier(.3,1.3,.5,1); }
.cpos.drag { z-index: 50; cursor: grabbing; }
.cpos.drag::after { transform: translate(14px, 18px) scale(1.15); opacity: .7; }
.cpos.drag .cfloat { animation-play-state: paused; transform: scale(1.12) translateY(-6px); }
.cfloat { animation: bobc 4.2s ease-in-out infinite; animation-delay: var(--dl, 0s); transition: transform .15s; }
@keyframes bobc { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
.cpos.shake .cfloat { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px) rotate(-4deg); } 50% { transform: translateX(9px) rotate(4deg); } 80% { transform: translateX(-5px); } }
.cube { position: relative; width: var(--s); height: var(--s); transform-style: preserve-3d; transform: rotateX(-22deg) rotateY(-30deg); animation: sway 6s ease-in-out infinite; animation-delay: var(--dl, 0s); }
@keyframes sway { 0%,100% { transform: rotateX(-22deg) rotateY(-30deg); } 50% { transform: rotateX(-17deg) rotateY(-20deg); } }
.f { position: absolute; inset: 0; background: var(--c); border-radius: 12px; backface-visibility: hidden; display: grid; place-items: center; }
.f.front { transform: translateZ(calc(var(--s) / 2)); color: var(--t); font-weight: 800; font-size: calc(var(--s) * .165); line-height: 1.2; text-align: center; padding: 8%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.28), inset 0 -10px 18px rgba(0,0,0,.12); }
.f.top { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); background-image: linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,.5)); }
.f.right { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); background-image: linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.3)); }
.f.left { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); background-image: linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.18)); }

.zones { display: flex; gap: 12px; max-width: 560px; margin: 26px auto 0; perspective: 800px; }
.zone {
  flex: 1; min-width: 0; min-height: 168px; padding: 12px 10px 14px; border-radius: 22px; position: relative;
  transform: rotateX(10deg); transform-origin: 50% 100%; transition: transform .25s, box-shadow .25s, background .25s;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.zone.like { background: linear-gradient(180deg, #fff1ec, #ffd9d2); border: 2px dashed #e4565d; box-shadow: 0 8px 0 -1px #e9a09a, 0 18px 26px rgba(160,50,50,.22); }
.zone.dislike { background: linear-gradient(180deg, #f2f8fc, #d7e8f4); border: 2px dashed #7ba7c7; box-shadow: 0 8px 0 -1px #a9c6dc, 0 18px 26px rgba(60,100,140,.2); }
.zone.hot { transform: rotateX(4deg) translateY(-6px) scale(1.03); }
.zone.like.hot { box-shadow: 0 8px 0 -1px #e9a09a, 0 0 0 4px rgba(228,86,93,.35), 0 22px 30px rgba(160,50,50,.3); }
.zone.dislike.hot { box-shadow: 0 8px 0 -1px #a9c6dc, 0 0 0 4px rgba(123,167,199,.45), 0 22px 30px rgba(60,100,140,.3); }
.zone h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.15rem; display: flex; align-items: center; gap: 6px; }
.zone.like h3 { color: #b92f3c; } .zone.dislike h3 { color: #3f6f94; }
.zone h3 svg { width: 20px; height: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { background: var(--c); color: var(--t); font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 99px; box-shadow: 0 3px 0 rgba(0,0,0,.18); animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.toast { position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); background: var(--ruby-deep); color: #fff; font-weight: 700; padding: 10px 20px; border-radius: 99px; box-shadow: 0 8px 22px rgba(0,0,0,.3); opacity: 0; transition: opacity .25s, transform .25s; z-index: 40; pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ================= PAGE 3 : the reveal ================= */
.finale {
  min-height: 100dvh; scroll-snap-align: start; display: grid; place-items: center; text-align: center; color: var(--ink);
  background: radial-gradient(circle at 50% 30%, rgba(240,205,122,.5), rgba(240,205,122,0) 55%), linear-gradient(180deg, #f2d8c4, #fbf1e2);
  padding-top: 60px; padding-bottom: 60px;
}
.finale .inner { max-width: 26rem; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.finale .gift { width: 150px; height: 150px; animation: hop 1.8s ease-in-out infinite; filter: drop-shadow(0 14px 12px rgba(120,40,40,.3)); }
@keyframes hop { 0%,100% { transform: translateY(0) rotate(-2deg); } 45% { transform: translateY(-18px) rotate(2deg); } 60% { transform: translateY(0); } }
.finale h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 8vw, 2.6rem); line-height: 1.2; margin: 0; color: var(--ruby-deep); text-wrap: balance; }
.cta { display: inline-block; text-decoration: none; background: linear-gradient(180deg, #e8505c, #c32e3d); color: #fff; font-weight: 800; font-size: 1.1rem; padding: 16px 30px; border-radius: 18px; box-shadow: 0 6px 0 #8f1f2d, 0 16px 24px rgba(143,31,45,.35); transition: transform .12s, box-shadow .12s; border: 2px solid rgba(255,255,255,.4); }
.cta:active { transform: translateY(5px); box-shadow: 0 1px 0 #8f1f2d, 0 6px 12px rgba(143,31,45,.35); }
.soon { margin: 0; font-size: 14px; opacity: .7; }

@media (prefers-reduced-motion: reduce) {
  .key.idle, .scrollcue svg, .cfloat, .cube, .finale .gift, .lock.near, .flake, .bokeh { animation: none; }
}
</style>

<main>
  <!-- ===== PAGE 1 ===== -->
  <section class="stage bleed" id="stage">
    <div class="fx" id="fx"></div>

    <div class="cardwrap" id="cardwrap">
      <div class="tilt" id="tilt">
        <div class="card" id="card">
          <div class="thick t2"></div><div class="thick t1"></div>
          <div class="page-base">
            <p class="kick">היום זה היום שלך</p>
            <h1>יום הולדת<br>שמח</h1>
            <div class="rule"></div>
            <p class="nm" id="nameInside"></p>
          </div>

          <div class="cover" id="cover">
            <div class="face front">
              <!-- background layer -->
              <svg class="art" viewBox="0 0 300 426" aria-hidden="true">
                <defs>
                  <radialGradient id="ruby" cx="50%" cy="48%" r="75%"><stop offset="0" stop-color="#c23a50"/><stop offset=".55" stop-color="#8a1c34"/><stop offset="1" stop-color="#4a0b1d"/></radialGradient>
                  <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#fff3bf"/><stop offset=".28" stop-color="#e9c46a"/><stop offset=".5" stop-color="#a8802f"/><stop offset=".72" stop-color="#f6dc92"/><stop offset="1" stop-color="#b48a38"/>
                  </linearGradient>
                  <pattern id="lattice" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <path d="M0 0H26M0 0V26" stroke="#f0cd7a" stroke-opacity=".16" stroke-width=".8" fill="none"/>
                    <circle cx="13" cy="13" r="1.3" fill="#f0cd7a" fill-opacity=".28"/>
                  </pattern>
                  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
                </defs>
                <rect width="300" height="426" fill="url(#ruby)"/>
                <rect width="300" height="426" fill="url(#lattice)"/>
                <circle cx="150" cy="213" r="118" fill="url(#glow)"/>
                <rect x="11" y="11" width="278" height="404" rx="6" fill="none" stroke="url(#foil)" stroke-width="3"/>
                <rect x="18" y="18" width="264" height="390" rx="3" fill="none" stroke="url(#foil)" stroke-width="1" opacity=".8"/>
                <g id="corners" fill="none" stroke="url(#foil)" stroke-width="2.2" stroke-linecap="round">
                  <g id="cn"><path d="M17 50 Q17 17 50 17"/><path d="M25 44 Q25 25 44 25" stroke-width="1.2"/><circle cx="17" cy="17" r="3.2" fill="url(#foil)" stroke="none"/></g>
                  <use href="#cn" transform="translate(300 0) scale(-1 1)"/>
                  <use href="#cn" transform="translate(0 426) scale(1 -1)"/>
                  <use href="#cn" transform="translate(300 426) scale(-1 -1)"/>
                </g>
              </svg>
              <!-- foreground layer, floats above in 3D -->
              <svg class="art art-fg" viewBox="0 0 300 426" aria-hidden="true">
                <defs>
                  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fc08a"/><stop offset=".6" stop-color="#1f7a55"/><stop offset="1" stop-color="#0f4a35"/></linearGradient>
                  <radialGradient id="berry" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ff8d8d"/><stop offset=".45" stop-color="#d63c4a"/><stop offset="1" stop-color="#7d0f24"/></radialGradient>
                  <path id="star4" d="M0-8C1-2.5 2.5-1 8 0C2.5 1 1 2.5 0 8C-1 2.5-2.5 1-8 0C-2.5-1-1-2.5 0-8Z"/>
                </defs>
                <g id="flakes"></g>

<script>
(function () {

  // ---------- cover art (wreath + snowflakes) ----------
  (function () {

        s += '<circle cx="' + (bx + o[0]) + '" cy="' + (by + o[1]) + '" r="4.4" fill="url(#berry)" stroke="#5d0a1a" stroke-width=".5"/>' +
             '<circle cx="' + (bx + o[0] - 1.3) + '" cy="' + (by + o[1] - 1.5) + '" r="1.1" fill="#fff" opacity=".8"/>';
      });
    }

    for (var n = 0; n < 22; n++) {

  })();

  // ---------- ambient snow + bokeh on page 1 ----------
  (function () {
    var fx = $('fx'), h = '';

      var sz = 2 + Math.random() * 4;
      h += '<i class="flake" style="left:' + (Math.random() * 100).toFixed(1) + '%;width:' + sz.toFixed(1) + 'px;height:' + sz.toFixed(1) + 'px;opacity:' + (.35 + Math.random() * .55).toFixed(2) + ';--sw:' + ((Math.random() - .5) * 120).toFixed(0) + 'px;animation-duration:' + (9 + Math.random() * 10).toFixed(1) + 's;animation-delay:-' + (Math.random() * 18).toFixed(1) + 's"></i>';
    }

    for (var j = 0; j < 14; j++) {
      var d = 26 + Math.random() * 70;

    }

  })();

  // ---------- 3D tilt (pointer + idle sway) ----------
  var rx = 0, ry = 0, px = 0, py = 0, lastMove = -9999;
  window.addEventListener('pointermove', function (e) {
    px = (e.clientX / innerWidth - .5) * 2; py = (e.clientY / innerHeight - .5) * 2; lastMove = performance.now();
  }, { passive: true });
  (function loop(t) {
    var open = cover.classList.contains('open'), amp = reduce ? 0 : (open ? .45 : 1);
    var idle = t - lastMove > 2200, ty, tx;

    else { ty = px * 20; tx = -py * 12; }

    tiltEl.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
    card.style.setProperty('--sheen', (50 - ry * 2.6).toFixed(1) + '%');
    requestAnimationFrame(loop);
  })(0);

  // ---------- chains ----------
  var linkEls = [], unlocking = false;
  function buildChains() {
    chains.innerHTML = ''; linkEls = [];
    var W = card.offsetWidth, H = card.offsetHeight, step = 21;
    function chain(len, horizontal) {
      var n = Math.ceil((len + 40) / step), start = -20;
      for (var i = 0; i < n; i++) {
        var face = i % 2 === 0, pos = start + i * step, el = document.createElement('div');
        el.className = 'link ' + (face ? 'lk-face' : 'lk-edge');
        var lg = face ? 32 : 13, sh = face ? 19 : 15, w = horizontal ? lg : sh, h = horizontal ? sh : lg;
        el.style.width = w + 'px'; el.style.height = h + 'px';
        if (horizontal) { el.style.left = (pos - w / 2) + 'px'; el.style.top = (H / 2 - h / 2) + 'px'; }
        else { el.style.top = (pos - h / 2) + 'px'; el.style.left = (W / 2 - w / 2) + 'px'; }
        el.dataset.dist = Math.abs(pos - (horizontal ? W / 2 : H / 2));

      }

  }
  buildChains();
  window.addEventListener('resize', function () { if (!unlocking) buildChains(); fitOpen(); sizeCanvas(); });

  // ---------- confetti: ribbons, snow and tiny gifts ----------
  var cv = $('confetti'), ctx = cv.getContext('2d'), parts = [], running = false, dpr = 1;
  function sizeCanvas() { dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
  sizeCanvas();
  var COLORS = ['#e8484f', '#f6c453', '#ffffff', '#ffe9b0', '#2f9a6e', '#f4a3a8', '#e3bf6a', '#ffffff'];
  function burst(x, y, count, angle, spread, power) {
    for (var i = 0; i < count; i++) {
      var a = angle + (Math.random() - .5) * spread, v = power * (.35 + Math.random() * .75), q = Math.random();
      var kind = q < .5 ? 'r' : (q < .78 ? 's' : 'g');
      parts.push({
        x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, kind: kind,
        w: kind === 'g' ? 11 + Math.random() * 5 : 6 + Math.random() * 7, h: 3 + Math.random() * 5,
        r: Math.random() * 6.28, vr: (Math.random() - .5) * .3,
        c: kind === 'g' ? (Math.random() < .5 ? '#e8484f' : '#f6c453') : (kind === 's' ? '#ffffff' : COLORS[(Math.random() * COLORS.length) | 0]),
        g: kind === 's' ? .05 : (kind === 'g' ? .16 : .22), life: 0, max: 170 + Math.random() * 90, tilt: Math.random() * 6.28, ph: Math.random() * 6.28
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function rain(ms) { var t0 = performance.now(), id = setInterval(function () { if (performance.now() - t0 > ms) return clearInterval(id); burst(Math.random() * innerWidth, -12, 4, Math.PI / 2, .7, 2.4); }, 70); }
  function tick() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += p.g; p.vx *= .985; p.vy *= .985; if (p.kind === 's') p.vx += Math.sin(p.life * .07 + p.ph) * .06;
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.tilt += .12; p.life++;
      var alpha = p.life > p.max - 40 ? Math.max(0, (p.max - p.life) / 40) : 1;
      if (alpha <= 0 || p.y > innerHeight + 40) { parts.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(p.x, p.y); ctx.rotate(p.r);
      if (p.c === '#ffffff' || p.c === '#ffe9b0') { ctx.shadowColor = 'rgba(110,50,40,.45)'; ctx.shadowBlur = 4; }

  // ---------- key dragging ----------
  var dragging = false, sx = 0, sy = 0, tx = 0, ty = 0, NEAR = 46;
  function holeCenter() { var r = keyhole.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
  function keyTip() { var r = key.getBoundingClientRect(); return { x: r.left + r.width * .97, y: r.top + r.height / 2 }; }
  function setKey(x, y, extra) { key.style.transform = 'translate(' + x + 'px,' + y + 'px)' + (extra || ''); }
  function dist() { var a = keyTip(), b = holeCenter(); return Math.hypot(a.x - b.x, a.y - b.y); }

  });

    if (!dragging) return;
    tx = e.clientX - sx; ty = e.clientY - sy; setKey(tx, ty); lock.classList.toggle('near', dist() < NEAR);

    dragging = false; key.classList.remove('dragging');

    setTimeout(function () { hint.classList.remove('gone'); key.classList.remove('back-home'); key.classList.add('idle'); key.style.transform = ''; }, 600);
  }

  key.addEventListener('keydown', function (e) {

      var a = keyTip(), b = holeCenter(); tx += b.x - a.x; ty += b.y - a.y; setKey(tx, ty); unlock();
    }
  });

  // ---------- opening sequence ----------
  function fitOpen() {

    var W = card.offsetWidth, s = Math.min(1, (innerWidth - 32) / (2 * W));

  }
  function unlock() {
    unlocking = true; dragging = false; key.classList.remove('dragging', 'idle', 'back-home');

  // ================= sorting game =================
  var ITEMS = [
    { t: 'קניות בזארה', k: 'like' }, { t: 'פיג׳מות חורף', k: 'like' }, { t: 'לחם מחמצת', k: 'like' }, { t: 'צ׳יקיטי', k: 'like' },
    { t: 'כלים מלוכלכים', k: 'dislike' }, { t: 'שקיות זבל', k: 'dislike' }, { t: 'בוקר מוקדם', k: 'dislike' }
  ];
  var PAL = [['#e4565d', '#ffffff'], ['#f6c453', '#4a2a12'], ['#3f9b73', '#ffffff'], ['#fff4e0', '#8a1f2e'], ['#c93f4f', '#ffffff'], ['#f3a8a0', '#5a1520'], ['#5aa6a0', '#ffffff']];
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var field = $('field'), zones = { like: $('zlike'), dislike: $('zdislike') }, placed = 0, TOTAL = ITEMS.length;
  var toastEl = $('toast'), toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 1500); }

  function buildField() {
    field.innerHTML = '';
    var fw = field.clientWidth, fh = field.clientHeight, S = fw < 420 ? 88 : 104;
    var cols = fw < 420 ? 3 : 4, rows = Math.ceil(TOTAL / cols), cw = fw / cols, ch = fh / rows;

      left = Math.max(0, Math.min(fw - S, left)); top = Math.max(0, Math.min(fh - S, top));

      pos.dataset.k = it.k; pos.dataset.t = it.t; pos.dataset.c = pal[i][0]; pos.dataset.tc = pal[i][1];

  function zoneAt(x, y) {

  }
