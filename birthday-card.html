<title>Birthday Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,600&display=swap">
<style>
/* Layout: one full-screen stage with a gift card in the middle, wrapped in two crossing chains and a padlock.
   A gold key waits at the side; dragging it into the lock opens everything. Content scrolls below after opening. */
:root {
  --pine: #0e2a24;
  --pine-deep: #081a16;
  --cranberry: #7b1e2e;
  --cranberry-deep: #52121f;
  --gold: #e3bf6a;
  --gold-deep: #b48a38;
  --cream: #f6eddb;
  --ink: #3a1a20;
  --steel: #cdd5d9;
  --steel-deep: #8a959b;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --W: min(68vw, 300px);
  --H: calc(var(--W) * 1.42);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--pine-deep);
  color: var(--cream);
  font-family: var(--body);
  font-size: 16px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
html.locked, html.locked body { overflow: hidden; height: 100%; touch-action: none; }

.stage {
  position: relative;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%, #17463a 0%, transparent 70%),
    radial-gradient(circle at 12% 18%, rgba(227,191,106,.10) 0 2px, transparent 3px),
    radial-gradient(circle at 82% 28%, rgba(227,191,106,.10) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 82%, rgba(227,191,106,.08) 0 2px, transparent 3px),
    radial-gradient(circle at 24% 72%, rgba(227,191,106,.08) 0 2px, transparent 3px),
    var(--pine);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  overflow: hidden;
}

/* ---------- card ---------- */
.cardwrap {
  position: relative;
  transition: transform 2.8s cubic-bezier(.45,.05,.2,1);
  will-change: transform;
}
.card {
  position: relative;
  width: var(--W);
  height: var(--H);
  perspective: 1800px;
  filter: drop-shadow(0 26px 34px rgba(0,0,0,.5));
}
.page-right, .cover, .face { position: absolute; inset: 0; }
.page-right {
  background: linear-gradient(100deg, #e9dcc0 0, var(--cream) 14%, var(--cream) 100%);
  border-radius: 2px 10px 10px 2px;
  color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 8% 9%;
  gap: .6em;
}
.page-right .kicker, .back .kicker {
  font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--gold-deep); margin: 0;
}
.page-right h1 {
  font-family: var(--display); font-style: italic; font-weight: 600;
  font-size: calc(var(--W) * .2); line-height: 1; margin: 0; color: var(--cranberry);
  text-wrap: balance;
}
.page-right .name { font-family: var(--display); font-size: calc(var(--W) * .09); margin: 0; color: var(--ink); }
.rule { width: 46px; height: 1px; background: var(--gold-deep); margin: .4em 0; opacity: .8; }
.page-right .scrollhint {
  position: absolute; bottom: 5%; font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--cranberry); opacity: 0; transition: opacity 1s;
}
.opened .scrollhint { opacity: .85; animation: bob 1.8s ease-in-out infinite; }

.cover {
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 2.8s cubic-bezier(.45,.05,.2,1);
}
.cover.open { transform: rotateY(-180deg); }
.face { backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 2px 10px 10px 2px; }
.front {
  background:
    linear-gradient(135deg, rgba(255,255,255,.06) 25%, transparent 25% 50%, rgba(255,255,255,.06) 50% 75%, transparent 75%) 0 0 / 22px 22px,
    linear-gradient(160deg, var(--cranberry) 0%, var(--cranberry-deep) 100%);
  box-shadow: inset 0 0 0 1px rgba(227,191,106,.5);
  display: flex; flex-direction: column; align-items: center; padding-top: 14%;
  text-align: center;
}
.front::before {
  content: ""; position: absolute; inset: 10px; border: 1px solid rgba(227,191,106,.55); border-radius: 2px 7px 7px 2px; pointer-events: none;
}
.front .kicker { color: var(--gold); font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; margin: 0; }
.front .for { font-family: var(--display); font-style: italic; font-size: calc(var(--W) * .13); color: var(--cream); margin: .35em 0 0; }
.front .stars { position: absolute; bottom: 9%; display: flex; gap: 10px; color: var(--gold); font-size: 12px; opacity: .85; }
.back {
  transform: rotateY(180deg);
  background: linear-gradient(260deg, #e9dcc0 0, var(--cream) 14%, var(--cream) 100%);
  border-radius: 10px 2px 2px 10px;
  color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 10%; gap: .8em;
}
.back p.line { font-family: var(--display); font-style: italic; font-size: calc(var(--W) * .075); line-height: 1.35; margin: 0; color: var(--cranberry-deep); text-wrap: balance; }

/* ---------- chains + lock ---------- */
.chains { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.link {
  position: absolute; border-radius: 99px;
  border: 4px solid var(--steel);
  background: transparent;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), 0 2px 3px rgba(0,0,0,.45);
  background-clip: padding-box;
}
.link.edge { border-color: var(--steel-deep); border-width: 3px; }
.link.fall { animation: fall 1.5s cubic-bezier(.55,0,.9,.55) forwards; animation-delay: var(--d); }
@keyframes fall {
  0% { transform: translate(0,0) rotate(0); opacity: 1; }
  15% { transform: translate(calc(var(--dx) * .1), -10px) rotate(calc(var(--r) * .1)); opacity: 1; }
  100% { transform: translate(var(--dx), 110vh) rotate(var(--r)); opacity: 1; }
}
.lock {
  position: absolute; left: 50%; top: 50%; width: 84px; height: 104px; margin: -52px 0 0 -42px; z-index: 4;
  filter: drop-shadow(0 6px 8px rgba(0,0,0,.5));
  transition: filter .25s;
  pointer-events: none;
}
.lock.near { filter: drop-shadow(0 0 14px rgba(227,191,106,.9)) drop-shadow(0 6px 8px rgba(0,0,0,.5)); animation: tremble .18s linear infinite; }
.lock .shackle { transform-origin: 62px 46px; transition: transform .6s cubic-bezier(.3,1.5,.5,1); }
.lock.unlocked .shackle { transform: translateY(-13px) rotate(-30deg); }
.lock.drop { animation: lockdrop 1.1s cubic-bezier(.55,0,.9,.55) forwards; }
@keyframes lockdrop { to { transform: translateY(95vh) rotate(24deg); } }
@keyframes tremble { 0%,100% { translate: 0 0; } 25% { translate: -1.5px 1px; } 75% { translate: 1.5px -1px; } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

/* ---------- key ---------- */
.keyzone {
  position: absolute; z-index: 6;
  left: max(14px, env(safe-area-inset-left, 0px));
  bottom: max(28px, calc(env(safe-area-inset-bottom, 0px) + 20px));
  display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
  pointer-events: none;
}
.keyhint { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); opacity: .85; transition: opacity .4s; }
.keyhint.gone { opacity: 0; }
.key {
  width: 120px; height: 40px; cursor: grab; pointer-events: auto;
  touch-action: none; user-select: none; -webkit-user-select: none;
  transform-origin: 97% 50%;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.55));
  outline-offset: 6px;
}
.key.idle { animation: nudge 2.4s ease-in-out infinite; }
.key.dragging { cursor: grabbing; transition: none; }
.key.back-home { transition: transform .45s cubic-bezier(.3,1.4,.5,1); }
.key.snap { transition: transform .18s ease-out; }
.key.turn { transition: transform .55s cubic-bezier(.5,0,.3,1); }
.key.vanish { opacity: 0; transition: opacity .5s; }
@keyframes nudge { 0%,60%,100% { transform: translateX(0); } 70% { transform: translateX(10px); } 80% { transform: translateX(0); } 90% { transform: translateX(7px); } }

canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

/* ---------- below the fold ---------- */
.more {
  position: relative;
  min-height: 80dvh;
  display: grid; place-items: center;
  padding-block: 12dvh;
  background: linear-gradient(var(--pine), var(--pine-deep));
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  text-align: center;
}
.more .inner { max-width: 34rem; }
.more h2 { font-family: var(--display); font-style: italic; font-weight: 400; font-size: clamp(2rem, 8vw, 3.2rem); margin: 0 0 .5em; color: var(--gold); text-wrap: balance; }
.more p { line-height: 1.7; color: var(--cream); opacity: .85; margin: 0 0 1em; }

@media (prefers-reduced-motion: reduce) {
  .key.idle, .opened .scrollhint, .lock.near { animation: none; }
}
</style>

<main>
  <section class="stage" id="stage">
    <div class="cardwrap" id="cardwrap">
      <div class="card" id="card">
        <div class="page-right">
          <p class="kicker">Today is yours</p>
          <h1>Happy<br>Birthday</h1>
          <div class="rule"></div>
          <p class="name" id="nameInside"></p>
          <span class="scrollhint">Scroll down &darr;</span>
        </div>
        <div class="cover" id="cover">
          <div class="face front">
            <p class="kicker">A little something for</p>
            <p class="for" id="nameFront"></p>
            <div class="stars" aria-hidden="true"><span>&#10022;</span><span>&#10022;</span><span>&#10022;</span></div>
          </div>
          <div class="face back">
            <p class="kicker">Before we start</p>
            <p class="line">Make a wish.<br>Then keep reading.</p>
          </div>
        </div>
        <div class="chains" id="chains"></div>
        <svg class="lock" id="lock" viewBox="0 0 84 104" aria-hidden="true">
          <defs>
            <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e4eaed"/><stop offset=".5" stop-color="#b9c3c8"/><stop offset="1" stop-color="#8d989e"/>
            </linearGradient>
          </defs>
          <g class="shackle"><path d="M22 48 V32 a20 20 0 0 1 40 0 V48" fill="none" stroke="#aeb8bd" stroke-width="9" stroke-linecap="round"/></g>
          <rect x="8" y="46" width="68" height="52" rx="11" fill="url(#steel)" stroke="#6f7a80" stroke-width="1.5"/>
          <rect x="14" y="52" width="56" height="40" rx="7" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1"/>
          <circle id="keyhole" cx="42" cy="68" r="6.5" fill="#262b2e"/>
          <path d="M39 72 L45 72 L47.5 85 L36.5 85 Z" fill="#262b2e"/>
        </svg>
      </div>
    </div>

    <div class="keyzone" id="keyzone">
      <span class="keyhint" id="keyhint">Drag the key to the lock</span>
      <svg class="key idle" id="key" viewBox="0 0 120 40" role="button" tabindex="0" aria-label="Key. Drag it to the lock, or press Enter to unlock.">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6dc92"/><stop offset=".55" stop-color="#e3bf6a"/><stop offset="1" stop-color="#a8802f"/>
          </linearGradient>
        </defs>
        <circle cx="18" cy="20" r="14.5" fill="none" stroke="url(#gold)" stroke-width="7"/>
        <circle cx="18" cy="20" r="4" fill="url(#gold)"/>
        <rect x="31" y="17" width="82" height="6.5" rx="3" fill="url(#gold)"/>
        <rect x="88" y="22" width="6" height="11" rx="1.5" fill="url(#gold)"/>
        <rect x="100" y="22" width="6" height="8" rx="1.5" fill="url(#gold)"/>
      </svg>
    </div>
  </section>

  <section class="more" id="more">
    <div class="inner">
      <h2>Many happy returns</h2>
      <p>This is where the message goes. Wishes, memories, a joke only the two of you get.</p>
      <p>More of the card comes next.</p>
    </div>
  </section>
</main>

<canvas id="confetti"></canvas>

<script>
(function () {
  // ----- edit these -----
  var NAME = 'You';
  // ----------------------

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var card = $('card'), wrap = $('cardwrap'), cover = $('cover'), chains = $('chains');
  var lock = $('lock'), key = $('key'), keyhole = $('keyhole'), hint = $('keyhint'), stage = $('stage');
  $('nameFront').textContent = NAME;
  $('nameInside').textContent = 'for ' + NAME;
  root.classList.add('locked');

  // ---------- chains ----------
  var linkEls = [];
  function buildChains() {
    chains.innerHTML = ''; linkEls = [];
    var W = card.offsetWidth, H = card.offsetHeight, step = 21;
    function chain(len, horizontal) {
      var n = Math.ceil((len + 40) / step), start = -20;
      for (var i = 0; i < n; i++) {
        var face = i % 2 === 0, pos = start + i * step;
        var el = document.createElement('div');
        el.className = 'link ' + (face ? 'face' : 'edge');
        var long = face ? 32 : 13, short = face ? 19 : 15;
        var w = horizontal ? long : short, h = horizontal ? short : long;
        el.style.width = w + 'px'; el.style.height = h + 'px';
        if (horizontal) { el.style.left = (pos - w / 2) + 'px'; el.style.top = (H / 2 - h / 2) + 'px'; }
        else { el.style.top = (pos - h / 2) + 'px'; el.style.left = (W / 2 - w / 2) + 'px'; }
        var mid = horizontal ? W / 2 : H / 2;
        el.dataset.dist = Math.abs(pos - mid);
        chains.appendChild(el); linkEls.push(el);
      }
    }
    chain(W, true); chain(H, false);
  }
  buildChains();
  window.addEventListener('resize', function () { if (!unlocking) buildChains(); fitOpen(); });

  // ---------- confetti ----------
  var cv = $('confetti'), ctx = cv.getContext('2d'), parts = [], running = false, dpr = 1;
  function sizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  }
  sizeCanvas(); window.addEventListener('resize', sizeCanvas);
  var COLORS = ['#e3bf6a', '#c8394f', '#2f8a66', '#f6eddb', '#f0a9b0', '#b48a38', '#e9c46a'];
  function burst(x, y, count, angle, spread, power) {
    for (var i = 0; i < count; i++) {
      var a = angle + (Math.random() - .5) * spread, v = power * (.35 + Math.random() * .75);
      parts.push({
        x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        w: 6 + Math.random() * 7, h: 3 + Math.random() * 5,
        r: Math.random() * 6.28, vr: (Math.random() - .5) * .35,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        round: Math.random() < .2, life: 0, max: 150 + Math.random() * 90, tilt: Math.random() * 6.28
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += .22; p.vx *= .985; p.vy *= .985;
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.tilt += .12; p.life++;
      var alpha = p.life > p.max - 40 ? Math.max(0, (p.max - p.life) / 40) : 1;
      if (alpha <= 0 || p.y > innerHeight + 40) { parts.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      var sq = Math.abs(Math.cos(p.tilt));
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.h * .8, 0, 6.28); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h * sq / 2, p.w, Math.max(1, p.h * sq));
      ctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- key dragging ----------
  var dragging = false, sx = 0, sy = 0, tx = 0, ty = 0, unlocking = false;
  var NEAR = 46;
  function holeCenter() { var r = keyhole.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
  function keyTip() { var r = key.getBoundingClientRect(); return { x: r.left + r.width * .97, y: r.top + r.height / 2 }; }
  function setKey(x, y, extra) { key.style.transform = 'translate(' + x + 'px,' + y + 'px)' + (extra || ''); }
  function dist() { var a = keyTip(), b = holeCenter(); return Math.hypot(a.x - b.x, a.y - b.y); }

  key.addEventListener('pointerdown', function (e) {
    if (unlocking) return;
    dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
    key.setPointerCapture(e.pointerId);
    key.classList.remove('idle', 'back-home'); key.classList.add('dragging');
    hint.classList.add('gone'); e.preventDefault();
  });
  key.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    tx = e.clientX - sx; ty = e.clientY - sy; setKey(tx, ty);
    lock.classList.toggle('near', dist() < NEAR);
  });
  function release() {
    if (!dragging) return;
    dragging = false; key.classList.remove('dragging');
    if (dist() < NEAR) { unlock(); return; }
    lock.classList.remove('near');
    key.classList.add('back-home'); tx = 0; ty = 0; setKey(0, 0);
    setTimeout(function () { hint.classList.remove('gone'); key.classList.remove('back-home'); key.classList.add('idle'); key.style.transform = ''; }, 600);
  }
  key.addEventListener('pointerup', release);
  key.addEventListener('pointercancel', release);
  key.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && !unlocking) {
      e.preventDefault(); key.classList.remove('idle'); hint.classList.add('gone');
      var a = keyTip(), b = holeCenter(); tx += b.x - a.x; ty += b.y - a.y; setKey(tx, ty);
      unlock();
    }
  });

  // ---------- opening sequence ----------
  function fitOpen() {
    if (!cover.classList.contains('open')) return;
    var W = card.offsetWidth, s = Math.min(1, (innerWidth - 32) / (2 * W));
    wrap.style.transform = 'translateX(' + (W / 2 * s) + 'px) scale(' + s + ')';
  }
  function unlock() {
    unlocking = true; dragging = false; key.classList.remove('dragging', 'idle', 'back-home');
    // snap tip into keyhole
    var a = keyTip(), b = holeCenter(); tx += b.x - a.x; ty += b.y - a.y;
    key.classList.add('snap'); setKey(tx, ty);
    setTimeout(function () {
      key.classList.remove('snap'); key.classList.add('turn'); setKey(tx, ty, ' rotate(90deg)');
    }, 220);
    setTimeout(function () { lock.classList.remove('near'); lock.classList.add('unlocked'); }, 700);
    setTimeout(function () {
      key.classList.add('vanish');
      var c = holeCenter();
      burst(c.x, c.y, 90, -Math.PI / 2, Math.PI * 1.1, 13);
      linkEls.forEach(function (el) {
        var d = +el.dataset.dist;
        el.style.setProperty('--d', (d * 5 + Math.random() * 160) + 'ms');
        el.style.setProperty('--dx', ((Math.random() - .5) * 160) + 'px');
        el.style.setProperty('--r', ((Math.random() - .5) * 900) + 'deg');
        el.classList.add('fall');
      });
    }, 950);
    setTimeout(function () { lock.classList.add('drop'); }, 1300);
    setTimeout(function () {
      cover.classList.add('open'); fitOpen();
      var h = innerHeight * .95;
      burst(0, h, 70, -Math.PI / 3, .8, 17);
      burst(innerWidth, h, 70, -Math.PI * 2 / 3, .8, 17);
    }, 2300);
    setTimeout(function () { burst(innerWidth / 2, innerHeight * .2, 60, Math.PI / 2, Math.PI, 6); }, 3600);
    setTimeout(function () {
      root.classList.remove('locked'); document.body.classList.add('opened');
    }, 5000);
  }
})();
</script>
